name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/native/lumberjack-peer/go.mod
          cache-dependency-path: src/native/lumberjack-peer/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run lumberjack:addon
      - run: npm run plugins:setup
      - run: npm run plugins:build-core
      - run: npm run plugins:build-authoring
      - run: npm run client:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/native/lumberjack-peer/go.mod
          cache-dependency-path: src/native/lumberjack-peer/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run lumberjack:addon
      - run: npm run plugins:setup
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/smoke-server.mjs --electron
